{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Gestión de Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar-menu">
            <div class="px-3 mb-4">
                <a href="{% url 'home_admin' %}" class="brand-title text-decoration-none">SISTEMA DE GESTIÓN DE INVENTARIO</a>
            </div>
            <nav class="nav flex-column px-2">
                <a class="nav-link {% if request.resolver_match.url_name == 'home_admin' %}active{% endif %}" href="{% url 'home_admin' %}">Inicio</a>
                <a class="nav-link {% if request.resolver_match.url_name == 'crear_producto' %}active{% endif %}" href="{% url 'crear_producto' %}">Productos</a>
                <a class="nav-link {% if request.resolver_match.url_name == 'listar_categorias' %}active{% endif %}" href="{% url 'listar_categorias' %}">Categorías</a>
                <a class="nav-link {% if request.resolver_match.url_name == 'registrar_movimiento' or request.resolver_match.url_name == 'movimientos' %}active{% endif %}" href="{% url 'movimientos' %}">Movimientos</a>
            </nav>
        </aside>

        <div class="flex-grow-1">
            <header class="top-navbar d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <div class="brand-title">SISTEMA DE GESTIÓN DE INVENTARIO</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button id="theme-toggle" class="btn btn-sm btn-outline-light">Modo Oscuro</button>
                    <button class="btn btn-sm btn-light">Perfil</button>
                </div>
            </header>

            <main class="content-layout">
                {% block contenido %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Contenedor del Popup de Notificaciones -->
    <div id="popup-notificacion" class="popup-oculto">
        <span id="popup-mensaje">Mensaje de prueba</span>
        <button onclick="cerrarPopup()" class="btn-cerrar">&times;</button>
    </div>

    <!-- Mensajes del sistema (Django) procesados por script.js -->
    {% if messages %}
        <div id="django-messages" style="display: none;">
            {% for message in messages %}
                <span class="django-message-item" data-tags="{{ message.tags }}">{{ message }}</span>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
